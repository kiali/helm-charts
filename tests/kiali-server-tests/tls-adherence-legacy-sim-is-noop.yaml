name: "tls_adherence_legacy_sim_is_noop"
description: "Setting simulateTlsAdherence to the legacy value is a no-op - the simulation knob can only tighten the gate, never relax it"
helm_args:
  - "--set"
  - "isOpenShift=true"
  - "--set"
  - "auth.strategy=anonymous"
  - "--set"
  - "deployment.tls_config.source=config"
  - "--set"
  - "simulateTlsAdherence=LegacyAdheringComponentsOnly"
yq_query: >
  .data."config.yaml" | from_yaml | .deployment.tls_config.source
expected_result: |
  config
should_fail: false
