name: "credential_secret_chatai_provider_disabled"
description: "Verify ai.chat provider credentials are NOT mounted when provider.enabled is false"
helm_args:
  - "--set"
  - "ai.chat.enabled=true"
  - "--set"
  - "ai.enabled=true"
  - "--set"
  - "ai.chat.default_provider=openai"
  - "--set"
  - "ai.chat.providers[0].name=openai"
  - "--set"
  - "ai.chat.providers[0].type=openai"
  - "--set"
  - "ai.chat.providers[0].config=default"
  - "--set"
  - "ai.chat.providers[0].enabled=true"
  - "--set"
  - "ai.chat.providers[0].default_model=gpt4"
  - "--set"
  - "ai.chat.providers[0].key=secret:ai-provider-creds:api-key"
  - "--set"
  - "ai.chat.providers[0].models[0].name=gpt4"
  - "--set"
  - "ai.chat.providers[0].models[0].model=gpt-4"
  - "--set"
  - "ai.chat.providers[0].models[0].enabled=true"
  - "--set"
  - "ai.chat.providers[0].models[0].key=secret:ai-model-creds:model-api-key"
  - "--set"
  - "ai.chat.providers[1].name=azure"
  - "--set"
  - "ai.chat.providers[1].type=openai"
  - "--set"
  - "ai.chat.providers[1].config=azure"
  - "--set"
  - "ai.chat.providers[1].enabled=false"
  - "--set"
  - "ai.chat.providers[1].default_model=gpt35"
  - "--set"
  - "ai.chat.providers[1].key=secret:ai-provider-creds:azure-api-key"
  - "--set"
  - "ai.chat.providers[1].models[0].name=gpt35"
  - "--set"
  - "ai.chat.providers[1].models[0].model=gpt-35-turbo"
  - "--set"
  - "ai.chat.providers[1].models[0].enabled=true"
  - "--set"
  - "ai.chat.providers[1].models[0].key=secret:ai-model-creds:azure-model-api-key"
yq_query: "select(.kind == \"Deployment\") | {\"provider_openai\": (.spec.template.spec.volumes | map(select(.name == \"chat-ai-provider-openai\")) | length), \"model_openai_gpt4\": (.spec.template.spec.volumes | map(select(.name == \"chat-ai-model-openai-gpt4\")) | length), \"provider_azure\": (.spec.template.spec.volumes | map(select(.name == \"chat-ai-provider-azure\")) | length), \"model_azure_gpt35\": (.spec.template.spec.volumes | map(select(.name == \"chat-ai-model-azure-gpt35\")) | length)}"
expected_result: |
  provider_openai: 1
  model_openai_gpt4: 1
  provider_azure: 0
  model_azure_gpt35: 0
should_fail: false
