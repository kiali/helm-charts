name: "credential_secret_chatai_model_disabled"
description: "Verify ai.chat model credentials are NOT mounted when model.enabled is false"
helm_args:
  - "--set"
  - "ai.chat.enabled=true"
  - "--set"
  - "ai.enabled=true"
  - "--set"
  - "ai.chat.default_provider=openai"
  - "--set"
  - "ai.chat.providers[0].name=openai"
  - "--set"
  - "ai.chat.providers[0].type=openai"
  - "--set"
  - "ai.chat.providers[0].config=default"
  - "--set"
  - "ai.chat.providers[0].enabled=true"
  - "--set"
  - "ai.chat.providers[0].default_model=gpt4"
  - "--set"
  - "ai.chat.providers[0].models[0].name=gpt4"
  - "--set"
  - "ai.chat.providers[0].models[0].model=gpt-4"
  - "--set"
  - "ai.chat.providers[0].models[0].enabled=true"
  - "--set"
  - "ai.chat.providers[0].models[0].key=secret:ai-model-creds:gpt4-api-key"
  - "--set"
  - "ai.chat.providers[0].models[1].name=gpt35"
  - "--set"
  - "ai.chat.providers[0].models[1].model=gpt-35-turbo"
  - "--set"
  - "ai.chat.providers[0].models[1].enabled=false"
  - "--set"
  - "ai.chat.providers[0].models[1].key=secret:ai-model-creds:gpt35-api-key"
yq_query: "select(.kind == \"Deployment\") | {\"enabled\": (.spec.template.spec.volumes | map(select(.name == \"chat-ai-model-openai-gpt4\")) | length), \"disabled\": (.spec.template.spec.volumes | map(select(.name == \"chat-ai-model-openai-gpt35\")) | length)}"
expected_result: |
  enabled: 1
  disabled: 0
should_fail: false
