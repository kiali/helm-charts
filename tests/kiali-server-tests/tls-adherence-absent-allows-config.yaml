name: "tls_adherence_absent_allows_config"
description: "An absent adherence (the lookup-empty default - today's common case, incl. clusters without the TLSAdherence feature gate) allows an explicit TLS config on OpenShift"
helm_args:
  - "--set"
  - "isOpenShift=true"
  - "--set"
  - "auth.strategy=anonymous"
  - "--set"
  - "deployment.tls_config.source=config"
yq_query: >
  .data."config.yaml" | from_yaml | .deployment.tls_config.source
expected_result: |
  config
should_fail: false
