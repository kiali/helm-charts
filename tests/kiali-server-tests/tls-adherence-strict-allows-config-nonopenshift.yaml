name: "tls_adherence_strict_allows_config_nonopenshift"
description: "The adherence gate is OpenShift-only - an explicit TLS config renders on non-OpenShift even with a strict simulated adherence"
helm_args:
  - "--set"
  - "isOpenShift=false"
  - "--set"
  - "deployment.tls_config.source=config"
  - "--set"
  - "simulateTlsAdherence=StrictAllComponents"
yq_query: >
  .data."config.yaml" | from_yaml | .deployment.tls_config.source
expected_result: |
  config
should_fail: false
