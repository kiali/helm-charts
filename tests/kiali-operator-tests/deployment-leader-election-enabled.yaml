name: "deployment_leader_election_enabled"
description: "Verify leader election is always enabled and lease RBAC is a namespaced Role, even with the default single replica"
helm_args: []
yq_query: "(select(.kind == \"Deployment\") | .spec.template.spec.containers[0].args[] | select(. == \"--leader-elect\")), (select(.kind == \"Role\") | .rules[0].resources[0]), (select(.kind == \"Role\") | .metadata.namespace), (select(.kind == \"RoleBinding\") | .kind)"
expected_result: |
  leases default
  ---
  RoleBinding
  ---
  --leader-elect
should_fail: false
